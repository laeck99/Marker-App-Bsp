<!doctype HTML>
<html>

<!--Muss mit LiveServer geoeffnet werden-->
<!--Hinweis: Der Preset-Marker Hiro (https://stemkoski.github.io/AR-Examples/markers/hiro.png) wird benoetigt-->
<!--Modell:https://github.com/KhronosGroup/glTF-Sample-Assets/tree/main/Models/Fox, © 2014, tomkranis. CC BY 4.0 International, © 2017, @AsoboStudio and @scurest. CC BY 4.0 International-->
<head>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
</head>

<body style='margin: 0px; overflow: scroll;'>

  <a-scene embedded arjs>
      <a-marker preset="hiro">
          <a-entity
              gltf-model=url(https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Fox/glTF-Binary/Fox.glb) 
              position="0 0 0"
              rotation="0 -90 90"
              scale="0.02 0.02 0.02 "
              animation-mixer>
          </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
